.cell.busy{background:color-mix(in srgb,var(--busy) 16%,var(--card));box-shadow:inset 3px 0 var(--busy);cursor:default}
.cell.blk{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--blk) 28%,var(--card)) 0 6px,color-mix(in srgb,var(--blk) 12%,var(--card)) 6px 12px);color:var(--mut)}
.cell.off{background:none;color:var(--mut);cursor:default;font-weight:400}.cell.past{opacity:.4;cursor:default}.cell.sel{background:var(--sel)!important;color:#fff;box-shadow:0 6px 14px -6px var(--sel)}
.badge{padding:3px 10px;border-radius:99px;font-size:.78em;font-weight:600;background:color-mix(in srgb,var(--mut) 16%,transparent);color:var(--mut)}
.b-Confirmada,.b-Realizada{background:color-mix(in srgb,var(--free) 16%,transparent);color:color-mix(in srgb,var(--free) 72%,var(--tx))}.b-Cancelada,.b-No\ asistió{background:color-mix(in srgb,var(--busy) 15%,transparent);color:color-mix(in srgb,var(--busy) 78%,var(--tx))}
.b-Reservada{background:color-mix(in srgb,var(--sel) 15%,transparent);color:color-mix(in srgb,var(--sel) 80%,var(--tx))}.b-Reprogramada{background:color-mix(in srgb,var(--acc) 22%,transparent);color:color-mix(in srgb,var(--acc) 60%,var(--tx))}
#mod{display:none;position:fixed;inset:0;background:rgba(10,16,28,.55);backdrop-filter:blur(4px);z-index:9;align-items:center;justify-content:center;padding:10px}#mod.on{display:flex}

@media(max-width:760px){.app{grid-template-columns:1fr!important}.side{position:static;height:auto;display:flex;overflow-x:auto;padding:8px}.side h1{display:none}.side button{width:auto;white-space:nowrap}.side button.on::before{display:none}main{padding:14px}.top{padding:10px 14px}.hero{padding:20px}}

body{background:radial-gradient(900px 420px at 88% -8%,color-mix(in srgb,var(--sel) 11%,transparent),transparent) fixed,radial-gradient(700px 380px at -5% 105%,color-mix(in srgb,var(--acc) 10%,transparent),transparent) fixed,var(--bg)}
.cal th.tdy{background:color-mix(in srgb,var(--acc) 16%,transparent);border-bottom:3px solid var(--acc);color:var(--tx)}.cal th small{color:var(--mut);font-weight:400}

.linkbox{font-family:ui-monospace,Consolas,monospace;font-size:.85em}details{margin-top:12px}summary{cursor:pointer;color:var(--mut)}

.card{transition:box-shadow .2s,transform .2s}.grid .card:hover{transform:translateY(-2px)}
/* ===== Capa sobria y profesional ===== */
body{background:var(--bg)}
.side{background:var(--pri);box-shadow:none}.side::after{display:none}
.side button i{width:auto;height:auto;background:none;border-radius:0;display:inline;box-shadow:none;transform:none}

.cell.free:hover{transform:none;background:color-mix(in srgb,var(--free) 26%,var(--card));box-shadow:inset 3px 0 var(--free)}
.cell.busy{background:color-mix(in srgb,var(--busy) 14%,var(--card));box-shadow:inset 3px 0 var(--busy);color:color-mix(in srgb,var(--busy) 70%,var(--tx))}

<script>
/* ===== 2. UTILIDADES (formato 12 h, zona America/Guayaquil) ===== */
const $=(s,e=document)=>e.querySelector(s),TZ='America/Guayaquil',uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DN=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'],ORD=[1,2,3,4,5,6,0];
const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:TZ}),P=s=>new Date(s+'T00:00:00');
const Y=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addD=(s,n)=>{const d=P(s);d.setDate(d.getDate()+n);return Y(d)},wkS=s=>addD(s,-((P(s).getDay()+6)%7));
const f12=m=>String(Math.floor(m/60)%12||12).padStart(2,'0')+':'+String(m%60).padStart(2,'0')+' '+(m>=720?'PM':'AM');
const fd=s=>P(s).toLocaleDateString('es-EC',{weekday:'short',day:'2-digit',month:'short',year:'numeric'});
const stamp=()=>new Date().toLocaleString('es-EC',{timeZone:TZ,hour12:true});
const TOPT=Array.from({length:205},(_,i)=>300+i*5).map(m=>`<option value="${m}">${f12(m)}</option>`).join('');
const sel=(v)=>`<option value="${v}" selected>`.replace('<option','<option');
/* ===== 3. ALMACENAMIENTO CENTRALIZADO (sustituible por API) ===== */
const KEY='entrevistas_v1',ROLES={admin:'Administrador principal',stake:'Administrador de estaca',ward:'Administrador de barrio',editor:'Editor',view:'Consulta',member:'Miembro'};
const PERM={admin:'vc cc ec dc mi cr er xr vp ex st au',stake:'vc cc ec dc mi cr er xr vp ex st',ward:'vc cc ec mi cr er xr vp ex st',editor:'vc cr er xr vp',view:'vc st',member:'vc cr'};
const PL={vc:'Ver calendarios',cc:'Crear calendarios',ec:'Editar calendarios',dc:'Eliminar calendarios',mi:'Administrar entrevistadores',cr:'Crear reservas',er:'Editar reservas',xr:'Cancelar reservas',vp:'Consultar participantes',ex:'Exportar información',st:'Consultar estadísticas',au:'Administrar usuarios'};
const DS={theme:'auto',ver:'4',pri:'#1f3a5f',acc:'#b08d57',free:'#2e8b6e',busy:'#c2453d',blk:'#9aa5b1',sel:'#2f5fa8',dens:'16',round:'10',shadow:'1',font:'system-ui,Segoe UI,sans-serif',fs:'15',fw:'400',lh:'1.5',rowh:'44',colw:'110',hideWk:'0',hideOff:'0',chart:'bar',labels:'1',side:'1',name:'Entrevistas',logo:'',welcome:'Programa y gestiona entrevistas sin cruces de horario.',instr:'Elige un horario libre, completa tus datos y guarda tu código de confirmación.',okMsg:'Tu entrevista quedó reservada. Guarda tu código.',kpis:'cal iv res hoy prox conf canc real esp ocup'};
var FB=null,FBW=true,RO=false;let SNAP=false;const b64=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''),unb64=t=>JSON.parse(decodeURIComponent(escape(atob(t.replace(/-/g,'+').replace(/_/g,'/')))));
let S=load();
function load(){try{const r=JSON.parse(localStorage.getItem(KEY));if(r&&r.v==1){r.set={...DS,...r.set};if(r.set.ver!=DS.ver){['pri','acc','free','busy','blk','sel','round','dens'].forEach(k=>r.set[k]=DS[k]);r.set.ver=DS.ver}return r}}catch(e){}return seed()}
function save(){if(SNAP||RO)return;if(FB&&FB.me){FB.sync();return}try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('No se pudo guardar en el navegador','err')}}
function aud(a,r,o,n){S.audit.unshift({id:uid(),ts:Date.now(),a,u:cu().name,t:stamp(),r,o:o?JSON.stringify(o):'',n:n?JSON.stringify(n):''});if(!FB)S.audit.length=Math.min(S.audit.length,500)}
const DB={get:(t,id)=>S[t].find(x=>x.id==id),
 add(t,o,l){o.id=o.id||uid();const wu=cu().wardId;if(wu&&(t=='calendars'||t=='interviewers')){o.wardId=wu;o.stakeId=cu().stakeId||o.stakeId||''}S[t].push(o);aud('Crear',t+': '+(l||o.name||o.id),null,o);save();return o},
 upd(t,id,p,l){const o=this.get(t,id),old=JSON.parse(JSON.stringify(o));Object.assign(o,p);aud('Editar',t+': '+(l||o.name||id),old,o);save();return o},
 del(t,id){const i=S[t].findIndex(x=>x.id==id),o=S[t][i];S[t].splice(i,1);aud('Eliminar',t+': '+(o.name||id),o,null);save()}};
const cu=()=>(FB&&FB.me)||S.users.find(u=>u.id==S.uid)||S.users[0],can=k=>{const u=cu();return u.role=='admin'||(u.perms?u.perms.includes(k):(PERM[u.role]||'').split(' ').includes(k))};
function seed(){const m=wkS(today()),d=(a,b)=>({s:a,e:b});
 const s={v:1,uid:'u1',set:{...DS},audit:[],blocks:[],
 stakes:[{id:'e1',name:'Estaca Demo Centro',demo:1}],
 wards:[{id:'b1',stakeId:'e1',name:'Barrio Demo Norte',demo:1},{id:'b2',stakeId:'e1',name:'Barrio Demo Sur',demo:1}],
 interviewers:[['i1','Carlos','Mora','Obispo'],['i2','Luis','Vera','Consejero'],['i3','Andrés','Pinto','Consejero']].map(x=>({id:x[0],first:x[1],last:x[2],name:x[1]+' '+x[2],email:x[1].toLowerCase()+'@demo.ec',phone:'0990000000',stakeId:'e1',wardId:'b1',calling:x[3],active:true,demo:1})),
 calendars:[{id:'c1',name:'Entrevistas Barrio Demo Norte',desc:'Calendario de demostración',stakeId:'e1',wardId:'b1',type:'Entrevista general',owner:'Secretario',status:'Activo',model:'shared',policy:'eq',ivIds:['i1','i2','i3'],days:{1:[d(540,720),d(840,1020)],2:[d(600,780)]},dur:20,gap:10,demo:1}],
 bookings:[['Ana Demo',m,540,'i1','Confirmada'],['Pedro Demo',m,540,'i2','Reservada'],['Rosa Demo',addD(m,1),600,'i1','Realizada']].map((x,i)=>({id:'k'+i,calId:'c1',name:x[0],phone:'0991111111',email:'',stakeId:'e1',wardId:'b1',date:x[1],start:x[2],end:x[2]+20,ivId:x[3],type:'Entrevista general',notes:'',code:'ENT-DEMO'+i,status:x[4],demo:1})),
 users:Object.keys(ROLES).map((r,i)=>({id:'u'+(i+1),name:ROLES[r]+' (demo)',role:r,demo:1}))};return s}
/* ===== 4. MOTOR DE DISPONIBILIDAD ===== */
function slotsFor(cal,date,ivId,ignore){if(cal.until&&date>cal.until)return[];const out=[],blocks=cal.days[P(date).getDay()]||[];
 let ivs=cal.ivIds.filter(i=>DB.get('interviewers',i)?.active);
 if(cal.model=='individual'){const t=ivId||ivs[0];ivs=ivs.includes(t)?[t]:[]}
 const bk=S.bookings.filter(b=>b.date==date&&b.status!='Cancelada'&&b.id!=ignore);
 for(const b of blocks)for(let t=b.s;t+cal.dur<=b.e;t+=cal.dur+cal.gap){const e=t+cal.dur;/* el intervalo interno solo avanza t: nunca genera una celda */
  const blk=S.blocks.some(x=>(x.calId==cal.id||x.calId=='*')&&x.date==date&&x.start<e&&t<x.end);
  const free=ivs.filter(i=>!bk.some(x=>x.ivId==i&&x.start<e&&t<x.end));
  out.push({date,s:t,e,free,total:ivs.length,state:blk?'blk':free.length?'free':'busy',past:date<today()})}

<script type="module">
/* ===== 13. FIREBASE (autenticación + Firestore) ===== */

const cfg={apiKey:"AIzaSyDHu9-qDfJ3qyI7_vD9N-DRDX0CVmJMBu4",authDomain:"entrevista-26cc3.firebaseapp.com",projectId:"entrevista-26cc3",storageBucket:"entrevista-26cc3.firebasestorage.app",messagingSenderId:"109356810733",appId:"1:109356810733:web:5db64777fabbb8bd42a7e4"},app=initializeApp(cfg);
const auth=getAuth(app),db=getFirestore(app),COLS=['stakes','wards','interviewers','calendars','bookings','blocks','audit'],last={},lockMap={},api={me:null,pubReady:false};

const lock=(b,id)=>({cal:b.calId,iv:b.ivId,date:b.date,s:b.start,e:b.end,b:id}),clean=o=>JSON.parse(JSON.stringify(o)),fail=e=>toast('Firebase: '+(e.code||e.message),'err');

api.createUser=async u=>{const sec=initializeApp(cfg,'sec'+Date.now());try{const cr=await createUserWithEmailAndPassword(getAuth(sec),u.email,u.password);await setDoc(doc(db,'profiles',cr.user.uid),{name:u.name,role:'custom',email:u.email,wardId:u.wardId,stakeId:u.stakeId,perms:u.perms});await signOut(getAuth(sec))}finally{await deleteApp(sec)}};

api.createBooking=async rec=>{const ids=units(rec);await runTransaction(db,async tx=>{const sn=await Promise.all(ids.map(i=>tx.get(doc(db,'locks',i))));if(sn.some(x=>x.exists()))throw new Error('conflict');ids.forEach(i=>tx.set(doc(db,'locks',i),lock(rec,rec.id)));tx.set(doc(db,'bookings',rec.id),clean(rec))});lockMap[rec.id]=ids;if(api.me)aud('Crear','reserva '+rec.code,null,{code:rec.code})};
async function relock(b){const want=b.status=='Cancelada'?[]:units(b),prev=lockMap[b.id]||[];if(want.join()==prev.join())return;
 try{await runTransaction(db,async tx=>{const add=want.filter(i=>!prev.includes(i)),sn=await Promise.all(add.map(i=>tx.get(doc(db,'locks',i))));if(sn.some(x=>x.exists()&&x.data().b!=b.id))throw new Error('conflict');prev.filter(i=>!want.includes(i)).forEach(i=>tx.delete(doc(db,'locks',i)));add.forEach(i=>tx.set(doc(db,'locks',i),lock(b,b.id)))});lockMap[b.id]=want}catch(e){toast(e.message=='conflict'?'Conflicto de horario: recarga la agenda':'No se pudo actualizar el horario','err')}}
const put=(c,id,o)=>{const j=JSON.stringify(o);if((last[c]??={})[id]===j)return false;last[c][id]=j;setDoc(doc(db,c,id),JSON.parse(j)).catch(fail);return true};
api.sync=()=>{if(!api.me||api.me.role=='member'||api.me.role=='view')return;
 for(const c of COLS){const seen=new Set();for(const it of S[c]){it.id=it.id||uid();seen.add(it.id);if(put(c,it.id,it)&&c=='bookings')relock(it)}
  for(const id of Object.keys(last[c]||{}))if(!seen.has(id)){delete last[c][id];deleteDoc(doc(db,c,id)).catch(fail);if(c=='bookings'){(lockMap[id]||[]).forEach(i=>deleteDoc(doc(db,'locks',i)));delete lockMap[id]}}}
 put('meta','set',S.set);if(api.me.role=='admin')S.users.forEach(u=>put('profiles',u.id,pf(u)));
 const keep=new Set();S.calendars.forEach(c=>{keep.add(c.id);const iv=x=>DB.get('interviewers',x);put('pub',c.id,{open:!!c.share,cal:{...c,share:c.id},ivs:c.ivIds.map(x=>({id:x,name:iv(x)?.name||'',active:iv(x)?.active!==false})),blocks:S.blocks.filter(b=>b.calId=='*'||b.calId==c.id)})});
 for(const id of Object.keys(last.pub||{}))if(!keep.has(id)){delete last.pub[id];deleteDoc(doc(db,'pub',id)).catch(fail)}};
function attach(){if(api.on)return;api.on=1;const err=e=>console.warn(e.code);
 const w=api.me.wardId,src=c=>(w&&api.me.role!='admin'&&['calendars','interviewers','bookings'].includes(c))?query(collection(db,c),where('wardId','==',w)):c=='audit'?query(collection(db,c),orderBy('ts','desc'),limit(200)):collection(db,c);
 COLS.forEach(c=>onSnapshot(src(c),sn=>{S[c]=sn.docs.map(d=>d.data());last[c]={};S[c].forEach(x=>last[c][x.id]=JSON.stringify(x));if(c=='bookings')S.bookings.forEach(b=>lockMap[b.id]=b.status=='Cancelada'?[]:units(b));later()},err));
 onSnapshot(doc(db,'meta','set'),d=>{if(d.exists()){S.set={...DS,...d.data()};last.meta={set:JSON.stringify(S.set)};later()}},err);
 onSnapshot(doc(db,'profiles',api.me.id),d=>{if(d.exists()){api.me={id:d.id,...d.data()};later()}},err);
 if(api.me.role=='admin')onSnapshot(collection(db,'profiles'),sn=>{S.users=sn.docs.map(d=>({id:d.id,...d.data()}));S.users.forEach(u=>(last.profiles??={})[u.id]=JSON.stringify(pf(u)));const m=S.users.find(u=>u.id==api.me.id);if(m)api.me={...api.me,...m};later()},err)}
onAuthStateChanged(auth,async u=>{if(RO)return;if(!u){api.me=null;return render()}
 try{const ref=doc(db,'profiles',u.uid);let p=await getDoc(ref);
  if(!p.exists()){const first=!(await getDoc(doc(db,'meta','bootstrap'))).exists(),b=writeBatch(db);b.set(ref,{name:(u.email||'').split('@')[0],role:first?'admin':'member',email:u.email||''});if(first)b.set(doc(db,'meta','bootstrap'),{uid:u.uid,at:Date.now()});await b.commit();p=await getDoc(ref)}
  [...COLS,'users'].forEach(c=>S[c]=[]);api.me={id:u.uid,...p.data()};if(api.me.role!='member')attach();render()}catch(e){fail(e)}});
/* Enlace público: lee la agenda publicada (sin datos personales) y los candados (solo horarios ocupados). */
api.initPublic=id=>{if(api.pubOn)return;api.pubOn=1;RO=true;let pub=null,locks=[],n=0;
 const build=()=>{const seen={};locks.forEach(l=>seen[l.b]={id:l.b,date:l.date,start:l.s,end:l.e,ivId:l.iv,status:'Reservada'});
  S={set:{...DS,...S.set},stakes:[],wards:[],audit:[],users:[{id:'u',name:'Miembro (público)',role:'member'}],uid:'u',calendars:pub&&pub.open?[pub.cal]:[],interviewers:pub?.ivs||[],blocks:pub?.blocks||[],bookings:Object.values(seen)};
  if(++n>=2){api.pubReady=true;render()}};
 onSnapshot(doc(db,'pub',id),d=>{pub=d.exists()?d.data():null;build()},e=>{pub=null;build()});
